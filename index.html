<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator & Timer App</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- Calculator -->
  <div class="calculator">

    <h2>Calculator</h2>

    <input type="text" id="display" readonly>

    <div class="buttons">

      <button onclick="clearDisplay()" class="red">AC</button>
      <button onclick="deleteLast()" class="orange">⌫</button>
      <button onclick="appendValue('%')">%</button>
      <button onclick="appendValue('/')" class="blue">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('*')" class="blue">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="appendValue('-')" class="blue">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('+')" class="blue">+</button>

      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>

      <button onclick="calculate()" class="green equal">=</button>

    </div>
  </div>

  <!-- Timer -->
  <div class="timer">

    <h2>Timer</h2>

    <div id="time">
      00 : 00 : 00
    </div>

    <div class="timer-buttons">
      <button onclick="startTimer()" class="green">Start</button>
      <button onclick="pauseTimer()" class="orange">Pause</button>
      <button onclick="resetTimer()" class="red">Reset</button>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
